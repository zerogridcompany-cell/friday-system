name: FridayMimi
options:
  bundleIdPrefix: com.〈会社〉
  deploymentTarget:
    iOS: "17.0"
targets:
  FridayMimi:
    type: application
    platform: iOS
    sources: [FridayMimi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.〈会社〉.fridaymimi
        DEVELOPMENT_TEAM: YOUR_TEAM_ID
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: FridayMimi/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
